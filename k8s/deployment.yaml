apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-cicd-app
  template:
    metadata:
      labels:
        app: java-cicd-app
    spec:
      containers:
      - name: springboot-app
        image: '2025vaishnavi/sprindboot-app:18'
        ports:
        - containerPort: 8080