apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-cicd-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-cicd-app
  template:
    metadata:
      labels:
        app: java-cicd-app
    spec:
      containers:
        - name: sprindboot-app
          image: 2025vaishnavi/sprindboot-app:IMAGE_TAG
          ports:
            - containerPort: 8080