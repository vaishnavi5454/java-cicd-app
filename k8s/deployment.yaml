apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-cicd-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-cicd-app
  template:
    metadata:
      labels:
        app: java-cicd-app
    spec:
      containers:
        - name: java-cicd-app
          image: YOUR_DOCKERHUB_USERNAME/java-cicd-app:latest
          ports:
            - containerPort: 8080